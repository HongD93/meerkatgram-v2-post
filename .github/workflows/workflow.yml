# Actions 탭 목록에 표시될 워크플로우명
name: Post Build And Deploy

# 이벤트 트리거 정의
on:
  # push 이벤트가 발생하면 트리거
  push:
    # 그 중에서 master 브랜치만 push 되었을 때 (다른 브랜치 push는 무시)
    branches: [master]

env:
  # ghcr.io에 올릴 이미지명 설정
  IMAGE_NAME: post-service
  # 매니페스트 작업 디렉토리
  MANIFEST_WORK_DIR: manifest
  # 매니페스트를 올릴 대상 레포
  MANIFEST_REPO: hongd93/msa4-k8s-manifest
  # 해당 메니페스트 레파지토리의 경로
  MANIFEST_PATH: post

# 해당 워크플로우가 실행 중 GITHUB_TOKEN에 부여할 권한 설정
permissions:
  # 해당 레포 코드를 checkout하기 위한 최소 조건
  contents: read
  # ghcr.io(github Packages)에 이미지를 push하기 위한 권한
  packages: write

jobs:
  # job의 id(임의로 지정 가능, actions 로그에 표시)
  build-and-push:
    # 해당 job을 실행할 GitHub 호스팅
    runs-on: ubuntu-22.04
    steps:
      # Actions 로그에 표시될 step명
      - name: Checkout
        # 현재 레포 코드를 러너로 내려받는 공식 액션
        uses: actions/checkout@v7
      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          # 로그인할 대상 레지스트리 주소
          registry: ghcr.io
          # 이 워크플로우를 트리거한, 사용자의 GitHubId
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push image
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE_NAME
          docker build -t $IMAGE:$GITHUB_RUN_NUMBER .
          docker push $IMAGE:$GITHUB_RUN_NUMBER
      # 다른 레파지토리(msa4-k8s-manifest)를 추가로 내려받기 위해 Checkout
      - name: Checkout k8s-manifests
        uses: actions/checkout@v7
        with:
          # 내려받을 대상 레포
          repository: ${{ env.MANIFEST_REPO }}
          # 다른 레포이므로 GITHUB_TOKEN 대신 10절에서 등록한 PAT 사용
          token: ${{ secrets.MANIFEST_REPO_TOKEN }}
          # 이 레포를 받아둘 하위 폴더 이름 (임의 지정 가능)
          path: manifests

      - name: Update image tag
        # 여기부터는 다시 run: 블록이므로 $VAR로 통일
        # 위 build 스텝과 동일하게 이미지 경로 재조립
        # k8s-manifests 안에서 이 서비스 폴더로 이동 (자기 폴더만 건드림)
        # deployment.yaml의 image 태그 줄을 방금 push한 태그로 치환
        # 커밋 작성자 이메일 (자유롭게 지정 가능한 값)
        # 커밋 작성자 이름
        # 변경된 deployment.yaml 커밋
        # k8s-manifests에 push → ArgoCD가 감지해 자동 배포
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE_NAME
          cd manifests/$MANIFEST_PATH
          sed -i "s|image: ${IMAGE}:.*|image: ${IMAGE}:${GITHUB_RUN_NUMBER}|" deployment.yaml
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git commit -am "Deploy ${IMAGE_NAME}:${GITHUB_RUN_NUMBER}"
          git push
